name: Publish catalog

# Pushes the generated catalog to the delivery branch `design-artifacts/kobento` of
# `yschimke/kobento-catalog-out`, the way the m3, Wear and Remote catalogs publish theirs, so a UI
# Builder host can open it through `PublishedCatalogLocation`. The branch is force-pushed with one
# commit: it is output, never history.
#
# Needs the `ARTIFACTS_TOKEN` secret (a fine-grained token with contents: write on the -out
# repository). Without it the job says so and succeeds, so a fresh fork or a repository that has
# not been set up yet stays green.

on:
  push:
    branches: [main]
    paths:
      - catalog/**
      - generator/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-design-artifacts-kobento
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to kobento-catalog-out
    if: ${{ github.repository == 'yschimke/kobento-catalog' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OUT_REPOSITORY: yschimke/kobento-catalog-out
      OUT_BRANCH: design-artifacts/kobento
      ARTIFACTS_TOKEN: ${{ secrets.ARTIFACTS_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check the catalog
        run: python3 -I generator/snapshot.py check

      - name: Push the delivery branch
        run: |
          set -euo pipefail
          if [ -z "${ARTIFACTS_TOKEN}" ]; then
            echo "::notice::ARTIFACTS_TOKEN is not set; skipping publish to ${OUT_REPOSITORY}."
            exit 0
          fi
          out="$(mktemp -d)"
          cp catalog/ui-builder.json catalog/components.snapshot.json "$out/"
          # The definitions and theme an editor expands Kobento's component calls with, and their
          # attribution, which travels with them.
          mkdir -p "$out/kobento"
          cp catalog/kobento/definitions.json catalog/kobento/theme.json catalog/kobento/NOTICE \
            catalog/kobento/LICENSE "$out/kobento/"
          # The seed documents, at the paths ui-builder.json's statusSemantics.templates names.
          mkdir -p "$out/ui-builder/designs"
          cp catalog/designs/*.json "$out/ui-builder/designs/"
          # The delivery branch's index. A preview server finds a catalog's ui-builder.json through
          # its `uiBuilderFile` and serves nothing from a branch without one; `components` is empty
          # because Kobento's components are drawn by Kobento, not rendered into a sheet here.
          python3 -I - "$out/catalog.json" "${GITHUB_SHA}" <<'PY'
          import datetime, json, sys
          path, sha = sys.argv[1], sys.argv[2]
          catalog = {
              "schema": "design-parity-catalog/v1",
              "system": "kobento",
              "title": "Kobento",
              "library": ["Kobento component library (mcp.kobento.dev)"],
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "components": [],
              "uiBuilderFile": "ui-builder.json",
          }
          with open(path, "w") as f:
              json.dump(catalog, f, indent=2)
              f.write("\n")
          PY
          echo "${GITHUB_SHA}" > "$out/source-commit.txt"
          cat > "$out/README.md" <<MD
          Generated by [yschimke/kobento-catalog](https://github.com/yschimke/kobento-catalog) at
          ${GITHUB_SHA}. Do not edit: every push to its \`main\` replaces this branch.
          MD
          cd "$out"
          git init -q -b "${OUT_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: publish kobento catalog from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${ARTIFACTS_TOKEN}@github.com/${OUT_REPOSITORY}.git" \
            "HEAD:refs/heads/${OUT_BRANCH}"
          echo "Published ${OUT_REPOSITORY}@${OUT_BRANCH}"
