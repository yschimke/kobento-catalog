name: CI

# The required check. Everything here runs offline: no Kobento token, no network beyond the checkout.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The published catalog is generated, never edited: it must be exactly what the generator
      # writes from the committed snapshot.
      - name: Catalog is what the generator writes
        run: python3 -I generator/snapshot.py check

      - name: Every JSON file parses
        run: |
          set -euo pipefail
          git ls-files -z '*.json' | xargs -0 -n1 python3 -I -m json.tool > /dev/null
